services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prgate_ai
      POSTGRES_USER: prgate_ai
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for ai}
    volumes:
      - ai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prgate_ai -d prgate_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  ai:
    build: .
    image: prgate-ai-service:local
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/prgate_ai
      DB_USERNAME: prgate_ai
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/prgate_ai
      SPRING_DATASOURCE_USERNAME: prgate_ai
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SONAR_HOST_URL: ${DOCKER_SONAR_URL:-http://host.docker.internal:9000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  ai-db-data:
