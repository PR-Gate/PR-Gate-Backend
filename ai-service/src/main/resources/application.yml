spring:
  application:
    name: ai-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ai-service;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
openai:
  api-key: ${OPENAI_API_KEY}
  model: ${OPENAI_MODEL}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
sonar:
  base-url: ${SONAR_HOST_URL:http://localhost:9000}
  token: ${SONAR_TOKEN:}
prgate:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN}