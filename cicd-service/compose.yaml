services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prgate_cicd
      POSTGRES_USER: prgate_cicd
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for cicd}
    volumes:
      - cicd-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prgate_cicd -d prgate_cicd"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  cicd:
    build: .
    image: prgate-cicd-service:local
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${SERVER_PORT:-8082}:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://postgres:5432/prgate_cicd
      DB_USERNAME: prgate_cicd
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/prgate_cicd
      SPRING_DATASOURCE_USERNAME: prgate_cicd
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SONAR_BASE_URL: ${DOCKER_SONAR_URL:-http://host.docker.internal:9000}
      SONAR_SCANNER_HOME: /opt/sonar-scanner
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  cicd-db-data:
