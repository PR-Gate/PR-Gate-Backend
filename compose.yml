services:
  users-service:
    build:
      context: ./users-service
      dockerfile: Dockerfile
    image: users-service:0.0.1
    container_name: users-service
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - ./users-service/.env
    restart: unless-stopped

  ai-service:
    profiles: ["ai"]
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: prgate-ai-service:0.0.1
    ports:
      - "${AI_SERVICE_PORT:-8081}:8081"
    env_file:
      - path: ./ai-service/.env
        required: false
    environment:
      SERVER_PORT: "8081"
    volumes:
      - ai-service-data:/app/data
    restart: unless-stopped

volumes:
  ai-service-data:
