services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: prgate_projects
      POSTGRES_USER: prgate_projects
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - projects-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  projects:
    build: .
    image: prgate-projects-service:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROJECTS_PORT:-8083}:8081"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/prgate_projects
      DB_USERNAME: prgate_projects
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      PRGATE_LOCAL_USERS: ${PROJECTS_LOCAL_USERS:-}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  projects-db-data:
