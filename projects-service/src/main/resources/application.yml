spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: projects-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/prgate_projects}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8081}

prgate:
  security:
    issuer: ${COGNITO_ISSUER:}
    client-id: ${COGNITO_CLIENT_ID:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: false

springdoc:
  swagger-ui:
    persist-authorization: false
