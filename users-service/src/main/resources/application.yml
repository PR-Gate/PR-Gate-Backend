spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: users-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pr-gate}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: users
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: users
    schemas: users

server:
  port: ${SERVER_PORT:8080}

# Disabled until explicitly configured. No credentials are stored in this file.
github:
  token-encryption-key: ${GITHUB_TOKEN_ENCRYPTION_KEY:}
  enabled: ${GITHUB_ENABLED:false}
  client-id: ${GITHUB_CLIENT_ID:}
  client-secret: ${GITHUB_CLIENT_SECRET:}
  redirect-uri: ${GITHUB_REDIRECT_URI:}
  cognito-issuer: ${COGNITO_ISSUER_URI:}
  cognito-client-id: ${COGNITO_CLIENT_ID:}

prgate:
  internal:
    service-token: ${INTERNAL_SERVICE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
